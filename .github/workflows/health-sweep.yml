name: health-sweep

# Every two hours, offset to an odd minute so this does not pile onto the same
# moment as every other cron job on the platform.
on:
  schedule:
    - cron: '17 */2 * * *'
  workflow_dispatch:

permissions:
  contents: read

# A sweep must not overlap itself: each run reads the *published* state, so two
# concurrent runs would both branch from the same snapshot and the second
# publish would discard the first run's down streaks. Queuing is safer than
# cancelling here, because a cancelled run publishes nothing at all.
concurrency:
  group: health-sweep
  cancel-in-progress: false

env:
  SHARD_COUNT: '4'
  MIN_DOWN_STREAK: '2'
  UP_FRESH_MS: '21600000'
  UP_SAMPLE_PERCENT: '20'
  REQUEST_TIMEOUT_MS: '10000'
  MIN_SPACING_MS: '500'
  REGION: us

jobs:
  verify:
    name: typecheck and test
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - run: npm ci

      - run: npm run typecheck

      - run: npm test

  probe:
    name: probe shard ${{ matrix.shard }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: verify
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        shard: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Probe shard
        env:
          SHARD: ${{ matrix.shard }}
          MAX_PROBES: '14000'
        run: node src/probe-shard.ts

      - name: Upload shard records
        uses: actions/upload-artifact@v4
        with:
          name: records-${{ matrix.shard }}
          path: out/records-${{ matrix.shard }}.json
          retention-days: 1
          if-no-files-found: error

  merge:
    name: merge and publish
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: probe
    permissions:
      # Job-level permissions replace the workflow-level block wholesale rather
      # than adding to it, so `contents: read` has to be restated here or the
      # checkout above has no token and fails with "repository not found".
      contents: read
      # configure-pages needs these to *create* the site, not just to upload an
      # artifact to one that already exists. Without them the enablement step
      # below fails with "Resource not accessible by integration".
      pages: write
      id-token: write
    env:
      # Read the streaks back out of the published feed. The run id is a
      # cache-busting query: Pages sits behind a CDN, and a stale copy of the state
      # would silently rewind every streak back to zero and re-probe everything.
      # A 404 here is expected before the first publish and starts from empty.
      STATE_URL: https://alphakenz.github.io/tarayx-health/health-state.json?run=${{ github.run_id }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - uses: actions/download-artifact@v4
        with:
          path: out
          pattern: records-*
          merge-multiple: true

      - name: Reduce state and build the feed
        run: node src/merge.ts

      - name: Sanity-check the feed before deploying
        run: |
          node --input-type=module -e '
            import { readFile } from "node:fs/promises";
            const feed = JSON.parse(await readFile("public/health.json", "utf8"));
            const channels = Object.values(feed.channels);
            const dead = channels.filter((c) => c.state === "dead").length;
            console.log(`channels ${channels.length}, dead ${dead}`);
            if (channels.length === 0) throw new Error("feed has no channels");
            // A guard against a bad sweep retiring a large share of the catalogue.
            if (dead / channels.length > 0.5) {
              throw new Error(`refusing to publish: ${dead}/${channels.length} dead`);
            }
          '

      - uses: actions/configure-pages@v5
        with:
          # Self-healing on purpose. A missing feed is indistinguishable from a
          # healthy one at the app: `fetchHealth` fails open, so a 404 leaves every
          # user seeing a complete catalogue and nothing anywhere reports a fault.
          # The site was found disabled with the previous publish still green, so
          # the pipeline recreates it rather than failing and going quietly inert.
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    name: deploy to pages
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: merge
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
